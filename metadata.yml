Title: CidalsDB anti-Leishmania and anti-SARS-CoV/SARS-CoV-2 activity model
Description: Scores compounds against Leishmania parasites and SARS-CoV-2 across six models drawn from cidalsDB, a curated resource of anti-pathogen bioactivity. Harigua-Souiai and colleagues assembled published screening data into a consistent database and fitted classifiers on top, with the explicit aim of supporting research on neglected diseases where screening capacity is scarce. Leishmaniasis and coronavirus data differ greatly in volume, so confidence is not uniform across the six outputs.
