Title: CidalsDB anti-Leishmania and anti-SARS-CoV/SARS-CoV-2 activity model
Description: Scores compounds for activity against Leishmania parasites and coronaviruses
  with the six classifiers deployed in CidalsDB, an open database that Harigua-Souiai
  and colleagues at Institut Pasteur de Tunis built from curated literature reports
  and PubChem bioassays. Random forest, multilayer perceptron and ChemBERTa cover
  the anti-Leishmania endpoint, while gradient boosting, a graph convolutional network
  and ChemBERTa cover coronaviruses. The underlying datasets are heavily imbalanced
  towards inactives and differ greatly in volume, so confidence is not uniform across
  the six outputs.
